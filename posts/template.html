        </div>
        <nav class="main-nav">
            <ul class="menu-list">
                <li><a href="../index.html" class="nav-item active" data-target="gallery-section" data-category="All">首页</a></li>
                <li><a href="../index.html#gallery/outdoor" class="nav-item" data-target="gallery-section" data-category="outdoor">户外</a></li>
                <li><a href="../index.html#gallery/HDR" class="nav-item" data-target="gallery-section" data-category="HDR">HDR</a></li>

                <li><a href="../index.html#gallery/astronomy" class="nav-item" data-target="gallery-section" data-category="astronomy">星野</a></li>
                <li><a href="../posts/aboutandcontact.html" class="nav-item">关于本站和联系我</a></li>
                <li><a href="../index.html#blog" class="nav-item" data-target="blog-section">blog</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article class="article-content">
            <header class="article-header">
                <h1 class="article-title"></h1>
                <div class="article-meta">
                    <span>作者：@ScienceOutdoors_FPV</span> ·
                    <span>发布日期：2024-02-20</span> ·
                    <span>分类：</span>
                </div>
                <img src="../photos/fengmian/sun.jpg" alt="null" class="article-cover">
            </header>
            
            <div id="toc-container" class="toc-container" style="margin-bottom:0;">
              <h2>📑 目录</h2>
              <ul id="toc-list"></ul>
            </div>

            <script>
                document.addEventListener("DOMContentLoaded", function() {
                    const tocList = document.getElementById("toc-list");
                    
                    const headers = document.querySelectorAll(
                        ".article-body h2, .article-body h2 strong, .article-body strong:not(h2 strong)"
                    );
                    
                    headers.forEach((header, index) => {
                        if (header.tagName === 'STRONG' && header.closest('h2')) {
                            return;
                        }
                        
                        const anchorId = "section-" + index;
                        header.setAttribute("id", anchorId);
                        
                        header.classList.add("toc-item");

                        const li = document.createElement("li");
                        
                        if (header.tagName === 'H2') {
                            li.classList.add("toc-level-1");
                        } else {
                            li.classList.add("toc-level-2");
                        }
                        
                        const a = document.createElement("a");
                        a.href = "#" + anchorId;
                        a.textContent = header.textContent;
                        a.style.color = "#007bff";
                        a.style.textDecoration = "none";
                        a.onmouseover = () => (a.style.textDecoration = "underline");
                        a.onmouseout = () => (a.style.textDecoration = "none");

                        li.appendChild(a);
                        tocList.appendChild(li);
                    });
                });
            </script>
            
            <div class="article-body">
                <div class="multiline-text">

                </div>
            </div>
            <a href="../index.html#blog" class="a-back" style="font-size: 1.05rem;">
                返回博客列表
            </a>
        </article>
    </main>
    <footer class="site-footer">
        <p class="footer-left">©2024-2025 李忠平版权所有。</p>
        <p class="footer-center">请不要在您不能控制的场合提及本站。</p>
    </footer>
</body>
</html>
